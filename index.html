
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Image AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #container {
      width: 100vw;
      height: 100dvh;
      position: relative;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      color: white;
      background: #222c;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
    }

    #modelInfo {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 8px 12px;
      color: white;
      background: #222c;
      border-radius: 10px;
      font-size: 11px;
      text-align: center;
      white-space: pre-line;
    }

    #startButton {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 16px 26px;
      border: 0;
      border-radius: 12px;
      background: white;
      font-size: 17px;
    }

    #controls {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    #controls button {
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: white;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="container"></div>
  <div id="status">AR 준비 중...</div>
  <div id="modelInfo">GLB 파일 확인 중...</div>

  <button id="startButton">카메라 시작</button>

  <div id="controls">
    <button id="smaller">－</button>
    <button id="reset">초기화</button>
    <button id="bigger">＋</button>
  </div>

  <script type="module">

    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MindARThree } from "mindar-image-three";

    const status = document.getElementById("status");
    const modelInfo = document.getElementById("modelInfo");
    const startButton = document.getElementById("startButton");

    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind",
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;

    const anchor = mindarThree.addAnchor(0);

    // 조명
    scene.add(
      new THREE.HemisphereLight(0xffffff, 0x444444, 1.5)
    );

    const directionalLight = new THREE.DirectionalLight(
      0xffffff, 2
    );

    directionalLight.position.set(1, 2, 3);
    scene.add(directionalLight);

    // =================================
    // 모델 크기 및 위치 설정
    // =================================

    const TARGET_MODEL_SIZE = 0.30;
    const MODEL_HEIGHT_OFFSET = 0.03;

    let modelRoot = null;
    let initialFitScale = 1;

    let modelLoaded = false;
    let loadError = false;
    let targetVisible = false;
    let started = false;
    let starting = false;

    const loader = new GLTFLoader();

    function updateStatus() {

      if (loadError) {
        status.textContent = "GLB 파일 로딩 실패";
      } else if (!modelLoaded) {
        status.textContent = "GLB 불러오는 중...";
      } else if (!started) {
        status.textContent = "모델 준비 완료 / 카메라 대기";
      } else if (targetVisible) {
        status.textContent = "마커 인식 완료";
      } else {
        status.textContent = "마커를 카메라에 비춰주세요";
      }
    }

    // =================================
    // GLB 로딩
    // =================================

    loader.load(
      "./model.glb",

      (gltf) => {

        const model = gltf.scene;

        // 원본 모델 크기 계산
        const box = new THREE.Box3().setFromObject(model);

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const maxDimension = Math.max(
          size.x,
          size.y,
          size.z
        );

        if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
          loadError = true;
          modelInfo.textContent = "모델 크기 계산 오류";
          updateStatus();
          return;
        }

        // 목표 크기에 맞춘 실제 배율
        initialFitScale = TARGET_MODEL_SIZE / maxDimension;

        // 모델의 밑면을 원점에 맞춤
        model.position.set(
          -center.x,
          -box.min.y,
          -center.z
        );

        // 사용자 조작 및 크기 조절 그룹
        modelRoot = new THREE.Group();

        // 크기 배율은 최상위 그룹에 적용
        modelRoot.scale.setScalar(initialFitScale);

        modelRoot.add(model);

        // 방향 설정 그룹
        const orientationGroup = new THREE.Group();

        orientationGroup.rotation.x = Math.PI / 2;
        orientationGroup.position.z = MODEL_HEIGHT_OFFSET;

        orientationGroup.add(modelRoot);

        anchor.group.add(orientationGroup);

        modelLoaded = true;

        modelInfo.textContent =
          "원본 크기: " +
          size.x.toFixed(3) + " × " +
          size.y.toFixed(3) + " × " +
          size.z.toFixed(3) +
          "\n목표 크기: " + TARGET_MODEL_SIZE +
          "\n실제 적용 배율: " + initialFitScale.toFixed(5) +
          "\n배치: 밑면 기준 / X축 90도";

        console.log("GLB 로딩 성공", gltf);
        console.log("목표 크기:", TARGET_MODEL_SIZE);
        console.log("실제 배율:", initialFitScale);

        updateStatus();
      },

      (progress) => {
        if (progress.total > 0) {
          modelInfo.textContent =
            "GLB 로딩 중: " +
            Math.round(progress.loaded / progress.total * 100) + "%";
        }
      },

      (error) => {
        console.error("GLB 로딩 오류:", error);

        loadError = true;
        modelInfo.textContent = "GLB 파일 로딩 오류";

        updateStatus();
      }
    );

    // =================================
    // 마커 인식
    // =================================

    anchor.onTargetFound = () => {
      targetVisible = true;
      updateStatus();
    };

    anchor.onTargetLost = () => {
      targetVisible = false;
      updateStatus();
    };

    // =================================
    // 카메라 시작
    // =================================

    async function startAR() {

      if (started || starting) return;

      starting = true;
      status.textContent = "카메라 권한 확인 중...";
      startButton.style.display = "none";

      try {

        await mindarThree.start();

        started = true;
        starting = false;

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        updateStatus();

      } catch (error) {

        console.error("AR 시작 오류:", error);

        starting = false;
        status.textContent = "카메라를 시작할 수 없습니다";
        startButton.style.display = "block";

      }
    }

    startAR();

    startButton.addEventListener("click", startAR);

    // =================================
    // 크기 조절
    // =================================

    document.getElementById("bigger").onclick = () => {

      if (!modelRoot) return;

      modelRoot.scale.multiplyScalar(1.2);

    };

    document.getElementById("smaller").onclick = () => {

      if (!modelRoot) return;

      modelRoot.scale.multiplyScalar(0.83);

    };

    // =================================
    // 초기화
    // =================================

    document.getElementById("reset").onclick = () => {

      if (!modelRoot) return;

      modelRoot.scale.setScalar(initialFitScale);
      modelRoot.rotation.set(0, 0, 0);

    };

    // =================================
    // 모바일 터치 회전
    // =================================

    let previousX = 0;
    let previousY = 0;
    let dragging = false;

    renderer.domElement.style.touchAction = "none";

    renderer.domElement.addEventListener("pointerdown", (e) => {

      if (!modelRoot) return;

      dragging = true;

      previousX = e.clientX;
      previousY = e.clientY;

      renderer.domElement.setPointerCapture(e.pointerId);

    });

    renderer.domElement.addEventListener("pointermove", (e) => {

      if (!dragging || !modelRoot) return;

      const deltaX = e.clientX - previousX;
      const deltaY = e.clientY - previousY;

      modelRoot.rotation.y += deltaX * 0.01;
      modelRoot.rotation.x += deltaY * 0.01;

      previousX = e.clientX;
      previousY = e.clientY;

    });

    renderer.domElement.addEventListener("pointerup", () => {
      dragging = false;
    });

    renderer.domElement.addEventListener("pointercancel", () => {
      dragging = false;
    });

  </script>

</body>
</html>
