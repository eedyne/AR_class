<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Image AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #container {
      width: 100vw;
      height: 100dvh;
      position: relative;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      color: white;
      background: #222c;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }

    #touchArea {
      position: fixed;
      inset: 0;
      z-index: 5;
      touch-action: none;
      background: transparent;
    }

    #startButton {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 16px 26px;
      border: 0;
      border-radius: 12px;
      background: white;
      font-size: 17px;
    }

    #controls {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      z-index: 15;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    #controls button {
      padding: 13px 20px;
      border: 0;
      border-radius: 12px;
      background: white;
      font-size: 17px;
      font-weight: bold;
      touch-action: manipulation;
    }
  </style>
</head>

<body>

  <div id="container"></div>
  <div id="touchArea"></div>
  <div id="status">AR 준비 중...</div>

  <button id="startButton">카메라 시작</button>

  <div id="controls">
    <button id="smaller">－</button>
    <button id="reset">초기화</button>
    <button id="bigger">＋</button>
  </div>

  <script type="module">

    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MindARThree } from "mindar-image-three";

    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const touchArea = document.getElementById("touchArea");

    // =================================
    // AR 초기 설정
    // =================================

    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind",
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;

    const anchor = mindarThree.addAnchor(0);

    // 조명
    scene.add(
      new THREE.HemisphereLight(0xffffff, 0x444444, 1.5)
    );

    const directionalLight = new THREE.DirectionalLight(
      0xffffff, 2
    );

    directionalLight.position.set(1, 2, 3);
    scene.add(directionalLight);

    // =================================
    // 콘텐츠 설정
    // =================================

    const TARGET_MODEL_SIZE = 1.00;
    const MODEL_HEIGHT_OFFSET = 0.03;

    // 콘텐츠 파일명
    const VIDEO_FILE = "./background.mp4";
    const IMAGE_FILE = "./background.jpg";
    const MODEL_FILE = "./model.glb";

    let modelRoot = null;
    let initialFitScale = 1;

    let video = null;
    let videoLoaded = false;
    let targetVisible = false;

    let started = false;
    let starting = false;

    const loader = new GLTFLoader();

    function updateStatus() {

      if (!started) {
        status.textContent = "카메라 대기 중";
      } else if (targetVisible) {
        status.textContent = "마커 인식 완료";
      } else {
        status.textContent = "마커를 카메라에 비춰주세요";
      }
    }

    // =================================
    // 배경 이미지 / 영상 표시
    // =================================

    function addBackground(texture) {

      const image = texture.image;

      const ratio = image.height / image.width;

      // 마커 폭 1을 기준으로 비율 유지
      const geometry = new THREE.PlaneGeometry(
        1,
        ratio
      );

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      });

      const plane = new THREE.Mesh(
        geometry,
        material
      );

      // 마커 표면에 배치
      plane.position.set(0, 0, 0);

      plane.renderOrder = 0;

      anchor.group.add(plane);

    }

    // 이미지 로딩
    function loadBackgroundImage() {

      const textureLoader = new THREE.TextureLoader();

      textureLoader.load(
        IMAGE_FILE,

        (texture) => {
          addBackground(texture);
          console.log("배경 이미지 로딩 성공");
        },

        undefined,

        (error) => {
          console.log("배경 이미지 없음 또는 로딩 실패");
        }
      );
    }

    // 영상 로딩
    function loadBackgroundVideo() {

      video = document.createElement("video");

      video.src = VIDEO_FILE;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.autoplay = false;
      video.preload = "auto";

      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");

      video.addEventListener("loadedmetadata", () => {

        if (videoLoaded) return;

        videoLoaded = true;

        const texture = new THREE.VideoTexture(video);

        texture.colorSpace = THREE.SRGBColorSpace;

        addBackground(texture);

        console.log("배경 영상 로딩 성공");

        if (targetVisible) {
          video.play().catch(() => {});
        }

      });

      video.addEventListener("error", () => {

        if (videoLoaded) return;

        console.log("영상 없음 또는 로딩 실패. 이미지 사용");

        videoLoaded = true;

        loadBackgroundImage();

      });

      video.load();

    }

    // 영상 우선, 실패 시 이미지 사용
    loadBackgroundVideo();

    // =================================
    // GLB 3D 모델 로딩
    // =================================

    loader.load(

      MODEL_FILE,

      (gltf) => {

        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const maxDimension = Math.max(
          size.x,
          size.y,
          size.z
        );

        if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
          console.log("모델 크기 계산 오류");
          return;
        }

        initialFitScale = TARGET_MODEL_SIZE / maxDimension;

        // 밑면 기준 위치
        model.position.set(
          -center.x,
          -box.min.y,
          -center.z
        );

        // 크기 및 회전 조작 그룹
        modelRoot = new THREE.Group();

        modelRoot.scale.setScalar(initialFitScale);
        modelRoot.add(model);

        // 기존 방향 및 위치 유지
        const orientationGroup = new THREE.Group();

        orientationGroup.rotation.x = Math.PI / 2;
        orientationGroup.position.z = MODEL_HEIGHT_OFFSET;

        orientationGroup.add(modelRoot);

        anchor.group.add(orientationGroup);

        console.log("GLB 모델 로딩 성공");

      },

      undefined,

      (error) => {
        console.log("GLB 없음 또는 로딩 실패");
      }

    );

    // =================================
    // 마커 인식
    // =================================

    anchor.onTargetFound = () => {

      targetVisible = true;

      if (video && videoLoaded) {
        video.play().catch(() => {});
      }

      updateStatus();

    };

    anchor.onTargetLost = () => {

      targetVisible = false;

      if (video) {
        video.pause();
      }

      updateStatus();

    };

    // =================================
    // 카메라 시작
    // =================================

    async function startAR() {

      if (started || starting) return;

      starting = true;

      status.textContent = "카메라 권한 확인 중...";
      startButton.style.display = "none";

      try {

        await mindarThree.start();

        started = true;
        starting = false;

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        updateStatus();

      } catch (error) {

        console.error("AR 시작 오류:", error);

        starting = false;

        status.textContent = "카메라를 시작할 수 없습니다";
        startButton.style.display = "block";

      }

    }

    startAR();

    startButton.addEventListener("click", startAR);

    // =================================
    // 확대 버튼
    // =================================

    document.getElementById("bigger").addEventListener("click", () => {

      if (!modelRoot) return;

      modelRoot.scale.multiplyScalar(1.2);

    });

    // =================================
    // 축소 버튼
    // =================================

    document.getElementById("smaller").addEventListener("click", () => {

      if (!modelRoot) return;

      modelRoot.scale.multiplyScalar(0.83);

    });

    // =================================
    // 초기화
    // =================================

    document.getElementById("reset").addEventListener("click", () => {

      if (!modelRoot) return;

      modelRoot.scale.setScalar(initialFitScale);
      modelRoot.rotation.set(0, 0, 0);

    });

    // =================================
    // 한 손가락 회전
    // 두 손가락 확대 / 축소
    // =================================

    const activePointers = new Map();

    let previousX = 0;
    let previousY = 0;

    let pinchStartDistance = 0;
    let pinchStartScale = 1;

    const ROTATION_SPEED = 0.01;

    function getPinchDistance() {

      const points = Array.from(activePointers.values());

      if (points.length < 2) return 0;

      const dx = points[0].x - points[1].x;
      const dy = points[0].y - points[1].y;

      return Math.sqrt(dx * dx + dy * dy);

    }

    touchArea.addEventListener("pointerdown", (e) => {

      if (!targetVisible || !modelRoot) return;

      e.preventDefault();

      activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
      });

      touchArea.setPointerCapture(e.pointerId);

      if (activePointers.size === 1) {

        previousX = e.clientX;
        previousY = e.clientY;

      }

      if (activePointers.size === 2) {

        pinchStartDistance = getPinchDistance();
        pinchStartScale = modelRoot.scale.x;

      }

    });

    touchArea.addEventListener("pointermove", (e) => {

      if (!activePointers.has(e.pointerId)) return;

      e.preventDefault();

      activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
      });

      // 한 손가락: 회전
      if (activePointers.size === 1 && modelRoot) {

        const deltaX = e.clientX - previousX;
        const deltaY = e.clientY - previousY;

        modelRoot.rotation.y += deltaX * ROTATION_SPEED;
        modelRoot.rotation.x += deltaY * ROTATION_SPEED;

        previousX = e.clientX;
        previousY = e.clientY;

      }

      // 두 손가락: 확대 / 축소
      else if (activePointers.size === 2 && modelRoot) {

        const currentDistance = getPinchDistance();

        if (pinchStartDistance > 0) {

          const scaleRatio = currentDistance / pinchStartDistance;

          const newScale = pinchStartScale * scaleRatio;

          const minScale = initialFitScale * 0.1;
          const maxScale = initialFitScale * 10;

          const clampedScale = THREE.MathUtils.clamp(
            newScale,
            minScale,
            maxScale
          );

          modelRoot.scale.setScalar(clampedScale);

        }

      }

    });

    function stopPointer(e) {

      if (!activePointers.has(e.pointerId)) return;

      activePointers.delete(e.pointerId);

      if (activePointers.size === 1) {

        const remaining = Array.from(activePointers.values())[0];

        previousX = remaining.x;
        previousY = remaining.y;

      } else if (activePointers.size === 0) {

        pinchStartDistance = 0;

      }

    }

    touchArea.addEventListener("pointerup", stopPointer);
    touchArea.addEventListener("pointercancel", stopPointer);
    touchArea.addEventListener("lostpointercapture", stopPointer);

  </script>

</body>
</html>
