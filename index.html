
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Image AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
    #container { width: 100vw; height: 100dvh; position: relative; }
    #status {
      position: fixed; top: 15px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; padding: 10px 16px;
      color: white; background: #222c;
      border-radius: 20px; font-size: 14px;
      white-space: nowrap;
    }
    #startButton {
      display: none; position: fixed;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 20; padding: 16px 26px;
      border: 0; border-radius: 12px;
      background: white; font-size: 17px;
    }
    #controls {
      position: fixed; bottom: 25px;
      left: 0; right: 0; z-index: 10;
      display: flex; justify-content: center; gap: 12px;
    }
    #controls button {
      padding: 12px 20px; border: 0;
      border-radius: 12px; font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="status">카메라 연결 중...</div>
  <button id="startButton">카메라 시작</button>

  <div id="controls">
    <button id="smaller">－</button>
    <button id="reset">초기화</button>
    <button id="bigger">＋</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MindARThree } from "mindar-image-three";

    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind",
      maxTrack: 1
    });

    const { renderer, scene } = mindarThree;
    const anchor = mindarThree.addAnchor(0);

    let model = null;
    const initialScale = 0.2;

    // GLB 불러오기
    const loader = new GLTFLoader();

    loader.load(
      "./model.glb",
      (gltf) => {
        model = gltf.scene;
        model.scale.setScalar(initialScale);
        anchor.group.add(model);
        status.textContent = "마커를 카메라에 비춰주세요";
      },
      undefined,
      (error) => {
        console.error(error);
        status.textContent = "GLB 파일 로딩 오류";
      }
    );

    // 마커 인식 상태
    anchor.onTargetFound = () => {
      status.textContent = "마커 인식 완료";
    };

    anchor.onTargetLost = () => {
      status.textContent = "마커를 찾아주세요";
    };

    // 카메라 자동 시작
    let started = false;
    let starting = false;

    async function startAR() {
      if (started || starting) return;

      starting = true;
      status.textContent = "카메라 권한을 확인하는 중...";
      startButton.style.display = "none";

      try {
        await mindarThree.start();

        started = true;
        starting = false;

        renderer.setAnimationLoop(() => {
          renderer.render(scene, mindarThree.camera);
        });

        status.textContent = "마커를 카메라에 비춰주세요";

      } catch (error) {
        console.error("AR 시작 오류:", error);

        starting = false;
        status.textContent = "카메라를 시작할 수 없습니다";
        startButton.style.display = "block";
      }
    }

    // 페이지 접속 즉시 카메라 시작 시도
    startAR();

    // 브라우저가 사용자 동작을 요구할 때 재시도
    startButton.addEventListener("click", startAR);

    // 크기 조절
    document.getElementById("bigger").onclick = () => {
      if (model) model.scale.multiplyScalar(1.15);
    };

    document.getElementById("smaller").onclick = () => {
      if (model) model.scale.multiplyScalar(0.87);
    };

    // 초기화
    document.getElementById("reset").onclick = () => {
      if (!model) return;
      model.scale.setScalar(initialScale);
      model.rotation.set(0, 0, 0);
      model.position.set(0, 0, 0);
    };

    // 드래그 회전
    let previousX = 0;
    let previousY = 0;

    renderer.domElement.addEventListener("pointerdown", (e) => {
      previousX = e.clientX;
      previousY = e.clientY;
    });

    renderer.domElement.addEventListener("pointermove", (e) => {
      if (!model || e.buttons !== 1) return;

      model.rotation.y += (e.clientX - previousX) * 0.01;
      model.rotation.x += (e.clientY - previousY) * 0.01;

      previousX = e.clientX;
      previousY = e.clientY;
    });
  </script>
</body>
</html>
